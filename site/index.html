<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maroof Khan</title>
  <meta name="description" content="Maroof Khan — personal portfolio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/person.webp">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="scroll-track">
    <main class="hero" id="home">

      <!-- 01 background crowd -->
      <div class="layer crowd-back" data-depth="0.012" data-sy="-40" data-ss="0.06">
        <div class="reveal">
          <img class="crowd-back__l" src="assets/crowd_back.webp" alt="">
          <img class="crowd-back__r" src="assets/crowd_back.webp" alt="">
        </div>
      </div>

      <!-- 02 particle dust -->
      <canvas class="layer dust" data-depth="0.02" aria-hidden="true"></canvas>

      <!-- 03 circle ring -->
      <div class="stem" aria-hidden="true"></div>
      <div class="layer ring-wrap" data-depth="0.022" data-ss="0.14" data-sy="-30" aria-hidden="true">
        <svg class="ring" viewBox="0 0 1000 1000">
          <circle class="ring__line" cx="500" cy="500" r="496" pathLength="1"/>
          <g class="ring__orbit">
            <circle class="ring__dot" cx="141.2" cy="155.4" r="7"/>
            <circle class="ring__dot" cx="960.0" cy="314.2" r="7"/>
          </g>
        </svg>
      </div>

      <!-- 04 main person -->
      <div class="layer person-wrap" data-depth="0.035" data-tilt="1" data-ss="0.12" data-sy="-20">
        <div class="reveal">
          <img class="person" src="assets/person.webp" alt="Maroof Khan in a light grey suit and dark sunglasses">
        </div>
      </div>

      <!-- 05 foreground people -->
      <div class="layer crowd-front" data-depth="0.07" data-ss="0.28" data-sy="60">
        <div class="reveal"><img src="assets/crowd_front.webp" alt=""></div>
      </div>

      <!-- 06 corner brackets -->
      <div class="layer brackets" data-depth="0.05" data-spread="1" aria-hidden="true">
        <span class="br br--tl"></span><span class="br br--bl"></span>
        <span class="br br--tr"></span><span class="br br--br"></span>
      </div>

      <!-- Title -->
      <div class="layer title-wrap" data-depth="0.045" data-sx="-90" data-fade="1">
        <h1 class="title">
          <span class="title__eyebrow" aria-label="Maroof">
            <span>M</span><span>A</span><span>R</span><span>O</span><span>O</span><span>F</span>
          </span>
          <span class="title__main" aria-label="Khan">
            <span class="ch">K</span><span class="ch">h</span><span class="ch">a</span><span class="ch">n</span>
          </span>
        </h1>
        <!-- 07 light flare -->
        <div class="flare" aria-hidden="true">
          <span class="flare__beam"></span>
          <span class="flare__core"></span>
          <span class="flare__sweep"></span>
        </div>
        <span class="title__dash" aria-hidden="true"></span>
      </div>

      <!-- Side actions -->
      <div class="layer actions-wrap" data-depth="0.045" data-sx="90" data-fade="1">
        <nav class="actions" aria-label="Quick links">
          <a class="action" href="#projects">
            <span class="action__dash"></span>
            <span class="action__label">Projects</span>
            <span class="action__btn action__btn--solid" data-magnetic><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
          </a>
          <a class="action" href="#contact">
            <span class="action__dash"></span>
            <span class="action__label">Contact Me</span>
            <span class="action__btn action__btn--ghost" data-magnetic><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
          </a>
        </nav>
      </div>

      <!-- 08 scroll indicator -->
      <a class="scroll-ind" href="#about" data-fade="1" aria-label="Scroll">
        <span class="scroll-ind__line"><i></i></span>
        <span class="scroll-ind__text">Scroll</span>
      </a>

      <!-- Header -->
      <header class="nav">
        <a class="brand" href="#home" aria-label="Maroof Khan — home">
          <svg class="brand__mark" viewBox="0 0 64 36" aria-hidden="true">
            <path class="m" d="M2 34V2h7.2L17 20.5 24.8 2H32v32h-6.4V14.6L19.6 29h-5.2L8.4 14.6V34z"/>
            <path class="k-stem" d="M34 2h6.4v32H34z"/>
            <path class="k-arm" d="M40.4 19.2 54.4 2h8.2L48.6 18.6 63 34h-8.4L44.8 23.4z"/>
          </svg>
          <span class="brand__divider"></span>
          <span class="brand__name">Maroof Khan</span>
        </a>

        <ul class="nav__links">
          <li><a class="is-active" href="#home">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#projects">Projects</a></li>
          <li><a href="#contact">Contact</a></li>
          <li class="nav__bar" aria-hidden="true"></li>
        </ul>

        <a class="pill" href="#contact" data-magnetic>
          <span class="pill__fill"></span>
          <span class="pill__text">Contact Me</span>
          <svg class="pill__arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </header>

    </main>
  </div>

  <script src="main.js"></script>
</body>
</html>
